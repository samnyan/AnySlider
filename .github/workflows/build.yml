name: Build DLL

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build AnySlider
        shell: pwsh
        run: |
          msbuild AnySlider.vcxproj `
            /m:1 `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:OutDir="$env:GITHUB_WORKSPACE\artifact\\"

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "artifact\AnySlider.dll"

          if (-not (Test-Path $dll)) {
            throw "Build succeeded but AnySlider.dll was not found at $dll"
          }

          $packageFiles = @(
            "config.toml",
            "LICENSE",
            "README.md",
            "README_CN.md",
            "THIRD_PARTY_NOTICES.md"
          )

          foreach ($file in $packageFiles) {
            Copy-Item $file (Join-Path $env:GITHUB_WORKSPACE "artifact\$file")
          }

          Get-Item $dll | Format-List Name, Length, LastWriteTime

      - name: Upload AnySlider.dll
        uses: actions/upload-artifact@v4
        with:
          name: AnySlider-${{ github.ref_name }}-${{ github.sha }}
          path: |
            artifact/AnySlider.dll
            artifact/config.toml
            artifact/LICENSE
            artifact/README.md
            artifact/README_CN.md
            artifact/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 30
