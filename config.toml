enabled = true
dll = ["AnySlider.dll"]

name = "AnySlider"
description = "Allows any controllers to use Mega Mix+'s native arcade slider."
version = "1.0"
author = "sam_nya"

# ============================
# Arcade controller bypass
# ============================

# Controllers listed here will be shown to the game as official HORI controllers.
# 054C:05C4 is the ViGEm virtual controller.
vid_pids = ["054C:05C4"]

# Choose which HORI controller type the game should see:
# 6 = HORI NSW-230 Mega39's, 7 = HORI PS4-161 Future Tone DX.
target_controller_type = 7

# ============================
# AnySlider IO
# ============================

# Enable AnySlider's additional input features.
# Leave this false if you only need controller VID/PID remapping above.
io_enabled = false

# Write extra information to the log while troubleshooting.
# Leave this false during normal play, especially with fast input devices.
debug = false

# Leave this unchanged unless the tool you use gives you another name.
io_shared_memory = "Local\\MMIO_SHARED_BUFFER"
# Maximum time, in milliseconds, that external input may remain valid.
# The input is released automatically if it is not refreshed in time.
io_max_input_lease_ms = 500

# Advanced: ignore the game's own controller input while AnySlider input is active.
# This can prevent duplicate input, but leave it false unless you need it.
io_exclusive_controller_input = false

# Keep the game running when another window is in front of it.
# Useful when controlling the game from another application.
io_keep_game_active_unfocused = false


# ============================
# Generic IO Settings
# "arcade" emulates keyboard/controller directions as slider touch movement.
# "joystick" maps keyboard/controller directions to the game's built-in left/right input.
io_slider_mode = "arcade"

# Emulated slider movement speed, measured in cells per second.
# Does not affect direct 32 cells input.
io_arcade_slider_emu_cells_per_second = 32.0

# ============================
# Keyboard&Mouse IO
# ============================

# Enable the built-in keyboard and mouse controls.
# The game will receive them as controller input.
io_keyboard_mouse_frontend = false
# Stop the game's original keyboard/mouse controls to prevent duplicate input.
# Only needed when the built-in keyboard/mouse controls are enabled.
io_block_keyboard_mouse_input = false

# Use mouse movement as two arcade slider controls.
io_use_mouse_as_slider = false
# Which mouse movement controls slider: "x", "y", or "wheel".
io_mouse_slider_1_axis = "x"
io_mouse_slider_2_axis = "y"
# Reverse the movement direction for a slider when true.
io_mouse_slider_1_invert = false
io_mouse_slider_2_invert = false
# Approximate mouse movement needed to cross one 16-cell slider half.
io_mouse_slider_counts_per_cycle = 256.0
# Movement multiplier. 1.0 is the normal speed.
io_mouse_slider_1_sensitivity = 1.0
io_mouse_slider_2_sensitivity = 1.0
# Keep touching the slider for this many milliseconds after the mouse stops.
# Use 0 to release it on the next input check without movement.
# If touch breaks during movement, try a slightly larger value.
io_mouse_slider_touch_hold_ms = 20
# Leave empty to use every mouse. Otherwise use a VID:PID such as "0E8F:1118" to filter single mouse device.
io_mouse_slider_device = ""

# ============================
# Gamepad IO
# ============================

# JoyShockLibrary controller frontend. Disabled by default.
io_gamepad_frontend = false
# First version supports only automatic device selection.
io_gamepad_device = "auto"
# Use a DS4/DualSense touchpad as slider input.
io_gamepad_touchpad_slider = true
# Reverse touchpad left/right.
io_gamepad_touchpad_invert = false
# Stick deadzone, from 0.1 to 0.95.
io_gamepad_stick_slider_deadzone = 0.3


# ============================
# Keyboard Keybinding
# ============================

# Each key setting can contain one key, comma-separated keys, or an array of keys.
# Use [] to disable a setting. Examples: W, F1, Enter, Left, Space, MouseLeft,
# or a virtual-key code such as 0x41.
io_key_test = ["F1"]
io_key_service = ["F2"]
io_key_pause = ["Escape"]
io_key_start = ["Enter"]
io_key_dpad_up = ["Up"]
io_key_dpad_down = ["Down"]
io_key_dpad_left = ["Left"]
io_key_dpad_right = ["Right"]
io_key_triangle = ["W"]
io_key_square = ["A"]
io_key_cross = ["S"]
io_key_circle = ["D"]
io_key_l1 = ["Z"]
io_key_r1 = ["X"]
io_key_l2 = []
io_key_r2 = []
io_key_select = []
io_key_l3 = []
io_key_r3 = []

# These keys move two separate slider touches across the 32 slider cells.
io_key_slider_1_left = ["Q"]
io_key_slider_1_right = ["E"]
io_key_slider_2_left = ["U"]
io_key_slider_2_right = ["O"]

# Optional direct bindings for individual slider cells. Cell 01 is the leftmost cell.
io_key_slider_01 = []
io_key_slider_02 = []
io_key_slider_03 = []
io_key_slider_04 = []
io_key_slider_05 = []
io_key_slider_06 = []
io_key_slider_07 = []
io_key_slider_08 = []
io_key_slider_09 = []
io_key_slider_10 = []
io_key_slider_11 = []
io_key_slider_12 = []
io_key_slider_13 = []
io_key_slider_14 = []
io_key_slider_15 = []
io_key_slider_16 = []
io_key_slider_17 = []
io_key_slider_18 = []
io_key_slider_19 = []
io_key_slider_20 = []
io_key_slider_21 = []
io_key_slider_22 = []
io_key_slider_23 = []
io_key_slider_24 = []
io_key_slider_25 = []
io_key_slider_26 = []
io_key_slider_27 = []
io_key_slider_28 = []
io_key_slider_29 = []
io_key_slider_30 = []
io_key_slider_31 = []
io_key_slider_32 = []
