enabled = true
dll = ["AnySlider.dll"]

name = "AnySlider"
description = "Allows any controllers to use Mega Mix+'s native arcade slider."
version = "1.0"
author = "sam_nya"

# Source devices to present to the game as an official HORI controller.
# ViGEm's default DualShock 4 v1 identity is 054C:05C4.
vid_pids = ["054C:05C4"]

# 6 = HORI NSW-230 Mega39's (0F0D:00FB)
# 7 = HORI PS4-161 Future Tone DX (0F0D:013C)
target_controller_type = 7

# Verbose diagnostic logging. May affect input performance with high-polling-rate devices.
debug = false


io_shared_memory = "Local\\MMIO_SHARED_BUFFER"
io_max_input_lease_ms = 500

# Advanced: disable the game's native controller input while AnySlider is active.
io_exclusive_controller_input = false

# Built-in keyboard/mouse test frontend, game will detect as gamepad.
io_keyboard_mouse_frontend = false
# Disable original keyboard/mouse input, otherwise it will cause dual input.
io_block_keyboard_mouse_input = false
# Emulate slider speed.
io_keyboard_slider_cells_per_second = 32.0

# Use relative Raw Input mouse movement as two arcade sliders.
# Requires io_keyboard_mouse_frontend = true.
io_use_mouse_as_slider = false
io_mouse_slider_1_axis = "x"
io_mouse_slider_2_axis = "y"
io_mouse_slider_1_invert = false
io_mouse_slider_2_invert = false
io_mouse_slider_counts_per_cycle = 256.0
io_mouse_slider_1_sensitivity = 1.0
io_mouse_slider_2_sensitivity = 1.0
# Keep simulated slider touch alive after movement stops.
# 0 releases the touch on the first frontend poll without movement.
# The next movement starts a new swipe from the slider center.
io_mouse_slider_touch_hold_ms = 0
# Optional case-insensitive substring filter for the Raw Input device path.
io_mouse_slider_device = ""

# Keep the game active even when not at foreground.
io_keep_game_active_unfocused = false

# Each binding accepts a comma-delimited string or a string array. [] disables it.
# Names conventions: W, F1, Enter, Left, LeftShift, NumPad0,
# Space, MouseLeft, or a literal virtual-key code such as 0x41.
io_key_test = ["F1"]
io_key_service = ["F2"]
io_key_pause = ["Escape"]
io_key_start = ["Enter"]
io_key_dpad_up = ["Up"]
io_key_dpad_down = ["Down"]
io_key_dpad_left = ["Left"]
io_key_dpad_right = ["Right"]
io_key_triangle = ["W"]
io_key_square = ["A"]
io_key_cross = ["S"]
io_key_circle = ["D"]
io_key_l1 = ["Z"]
io_key_r1 = ["X"]
io_key_l2 = []
io_key_r2 = []
io_key_select = []
io_key_l3 = []
io_key_r3 = []

# These move two independent slider contacts across the native 32 cells.
io_key_slider_1_left = ["Q"]
io_key_slider_1_right = ["E"]
io_key_slider_2_left = ["U"]
io_key_slider_2_right = ["O"]

# Optional direct slider-cell bindings. Cell 01 is the leftmost native sensor.
io_key_slider_01 = []
io_key_slider_02 = []
io_key_slider_03 = []
io_key_slider_04 = []
io_key_slider_05 = []
io_key_slider_06 = []
io_key_slider_07 = []
io_key_slider_08 = []
io_key_slider_09 = []
io_key_slider_10 = []
io_key_slider_11 = []
io_key_slider_12 = []
io_key_slider_13 = []
io_key_slider_14 = []
io_key_slider_15 = []
io_key_slider_16 = []
io_key_slider_17 = []
io_key_slider_18 = []
io_key_slider_19 = []
io_key_slider_20 = []
io_key_slider_21 = []
io_key_slider_22 = []
io_key_slider_23 = []
io_key_slider_24 = []
io_key_slider_25 = []
io_key_slider_26 = []
io_key_slider_27 = []
io_key_slider_28 = []
io_key_slider_29 = []
io_key_slider_30 = []
io_key_slider_31 = []
io_key_slider_32 = []
